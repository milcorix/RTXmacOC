name: build-macos

# Сборка драйверов RTXmacOC на macOS-раннере. Каждый компонент — отдельный шаг,
# чтобы было видно, что именно собралось, а что нет. Запуск на железе сюда не
# входит (RTX в раннере нет) — только проверка компиляции.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version || true
          echo "macOS SDK:     $(xcrun --sdk macosx --show-sdk-path)"
          echo "DriverKit SDK: $(xcrun --sdk driverkit --show-sdk-path 2>/dev/null || echo MISSING)"
          echo "iig:           $(xcrun --find iig 2>/dev/null || echo MISSING)"
          echo "clang:         $(xcrun --find clang)"
          ls "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/Kernel.framework/Headers" >/dev/null 2>&1 \
            && echo "Kernel.framework headers: present" \
            || echo "Kernel.framework headers: MISSING"

      - name: Build user-space pcie_probe
        run: |
          mkdir -p build
          clang pcie_probe.c -framework IOKit -framework CoreFoundation -o build/pcie_probe
          echo "OK: pcie_probe"

      - name: Build vbios_dump (portable C, layer 2 step 1)
        run: |
          mkdir -p build
          cc -Wall -Wextra -O2 tools/vbios_dump.c -o build/vbios_dump
          echo "OK: vbios_dump"

      - name: Build GSP Falcon primitives (portable C, layer 2 step 2)
        run: |
          mkdir -p build
          cc -Wall -Wextra -O2 -c driver/gsp/falcon.c -o build/falcon.o
          echo "OK: gsp/falcon.c"

      - name: Build FWSEC patch (portable C, layer 2 step 3)
        run: |
          mkdir -p build
          cc -Wall -Wextra -O2 -c driver/gsp/fwsec_patch.c -o build/fwsec_patch.o
          echo "OK: gsp/fwsec_patch.c"

      - name: Build FWSEC locator (portable C, layer 2 task 5)
        run: |
          mkdir -p build
          cc -Wall -Wextra -O2 -c driver/gsp/fwsec_locate.c -o build/fwsec_locate.o
          echo "OK: gsp/fwsec_locate.c"

      - name: Build FB layout / FRTS region (portable C, layer 2 task 5/9)
        run: |
          mkdir -p build
          cc -Wall -Wextra -O2 -c driver/gsp/fb_layout.c -o build/fb_layout.o
          echo "OK: gsp/fb_layout.c"

      - name: Build FWSEC kext orchestrator (compile-check, layer 2 task 5)
        run: |
          mkdir -p build
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          clang++ -x c++ -c driver/RTXProbe/FwsecRun.cpp \
            -arch x86_64 \
            -isysroot "$SDK" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/PrivateHeaders" \
            -fapple-kext -fno-builtin -fno-exceptions -fno-rtti -fno-common \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=gnu++17 \
            -o build/FwsecRun.o
          echo "OK: RTXProbe/FwsecRun.cpp"

      - name: Build kext RTXProbe (compile-check)
        run: |
          mkdir -p build
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          clang++ -x c++ -c driver/RTXProbe/RTXProbe.cpp \
            -arch x86_64 \
            -isysroot "$SDK" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/PrivateHeaders" \
            -fapple-kext -fno-builtin -fno-exceptions -fno-rtti -fno-common \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=gnu++17 \
            -o build/RTXProbe.o
          echo "OK: RTXProbe kext compiles"

      - name: Build kext MilcorixFB (IOFramebuffer, compile-check, layer 5)
        run: |
          mkdir -p build
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          clang++ -x c++ -c driver/macos/MilcorixFB.cpp \
            -arch x86_64 \
            -isysroot "$SDK" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/PrivateHeaders" \
            -fapple-kext -fno-builtin -fno-exceptions -fno-rtti -fno-common \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=gnu++17 \
            -o build/MilcorixFB.o
          echo "OK: MilcorixFB kext compiles (IOFramebuffer available)"

      - name: Build macOS firmware shim (compile-check, wall 2)
        run: |
          mkdir -p build
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          # Шим nv_fw_blob_get через BSD vnode API (файловый I/O из kext).
          clang++ -x c++ -c driver/macos/fw_blob_macos.cpp \
            -arch x86_64 \
            -isysroot "$SDK" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/PrivateHeaders" \
            -fapple-kext -fno-builtin -fno-exceptions -fno-rtti -fno-common \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=gnu++17 \
            -o build/fw_blob_macos.o
          echo "OK: fw_blob_macos (vnode firmware shim compiles)"

      - name: Build kext boot journal (mfb_klog — лог, переживающий чёрный экран)
        run: |
          mkdir -p build
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          # Трейс bring-up'а на диск + статус в NVRAM: без этого при чёрном экране
          # диагностировать нечем (unified log снаружи не разобрать).
          clang++ -x c++ -c driver/macos/mfb_klog.cpp \
            -arch x86_64 \
            -isysroot "$SDK" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/PrivateHeaders" \
            -fapple-kext -fno-builtin -fno-exceptions -fno-rtti -fno-common \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=gnu++17 \
            -o build/mfb_klog.o
          echo "OK: mfb_klog (журнал bring-up'а компилируется)"

      - name: Link full MilcorixFB kext (symbols resolve — walls 1-3 closed)
        run: |
          mkdir -p build
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          # Полная линковка kext: обвязка (MilcorixFB + fw_blob_macos) + ВЕСЬ
          # переносимый core. Ловит нерешённые символы — доказывает, что
          # оркестратор (стена 3) реально связан с nv_gsp_bringup, а прошивочный
          # шим (стена 2) закрывает nv_fw_blob_get. -r = частичная линковка
          # (kext грузится kextload, без обычного crt/main).
          CORE_OBJ=""
          for f in driver/gsp/*.c; do
            o="build/core_$(basename "$f" .c).o"
            clang -c "$f" -arch x86_64 -isysroot "$SDK" \
              -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
              -ffreestanding -fno-builtin -fno-common \
              -DKERNEL -DKERNEL_PRIVATE -DAPPLE -std=gnu11 -o "$o"
            CORE_OBJ="$CORE_OBJ $o"
          done
          ld -r -arch x86_64 \
            build/MilcorixFB.o build/fw_blob_macos.o build/mfb_klog.o $CORE_OBJ \
            -o build/MilcorixFB.kext.o
          echo "=== undefined symbols (ожидаем только IOKit/Kernel KPI) ==="
          nm -u build/MilcorixFB.kext.o | sort | tee build/undef.txt
          # Не должно быть неопределённых nv_* (наши) — все закрыты обвязкой/core.
          if nm -u build/MilcorixFB.kext.o | grep -q "_nv_"; then
            echo "FAIL: остались неопределённые nv_* символы (обвязка неполна)"; exit 1
          fi
          echo "OK: kext линкуется, все nv_* символы разрешены (стены 1-3 замкнуты)"

      - name: Build portable GSP core as kernel C (compile-check, layers 2-5)
        run: |
          mkdir -p build
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          # Переносимое ядро driver/gsp/*.c компилируем ровно в среде ядра macOS:
          # freestanding C, без libc, с kext-дефайнами. Это проверяет, что весь
          # core (falcon/booter/gsp_rm/gmmu/gsp_disp/...) реально kernel-safe, а не
          # только «собирается обычным cc на Linux». Каждый файл — отдельно, чтобы
          # было видно, какой именно не переносится.
          FAIL=0
          for f in driver/gsp/*.c; do
            if clang -c "$f" \
                -arch x86_64 \
                -isysroot "$SDK" \
                -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
                -ffreestanding -fno-builtin -fno-common \
                -DKERNEL -DKERNEL_PRIVATE -DAPPLE \
                -std=gnu11 \
                -o "build/$(basename "$f" .c).ko" 2>"build/$(basename "$f").log"; then
              echo "OK:   $f"
            else
              echo "FAIL: $f"
              cat "build/$(basename "$f").log"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "ВЕСЬ CORE kernel-C компилируется" || echo "часть core не переносится (см. выше)"

      - name: Build loadable MilcorixFB.kext bundle (ld -kext + bundle)
        run: |
          # Не compile-check, а НАСТОЯЩИЙ загружаемый артефакт: ld -kext
          # (MH_KEXT_BUNDLE) + бандл Contents/{Info.plist,MacOS/MilcorixFB}.
          # Скачивается из artifacts и ставится на стенд (kextload / OpenCore).
          # Запуск требует железа RTX 4070S — здесь только линковка+упаковка.
          tools/build_milcorixfb_kext.sh build
          echo "=== структура бандла ==="
          find build/MilcorixFB.kext -type f

      - name: Build dext RTXProbeDext (iig + compile-check)
        continue-on-error: true
        run: |
          mkdir -p build
          DK="$(xcrun --sdk driverkit --show-sdk-path)"
          IIG="$(xcrun --find iig)"
          "$IIG" \
            --def driver/RTXProbeDext/RTXProbeDext.iig \
            --header build/RTXProbeDext.h \
            --impl build/RTXProbeDext.iig.cpp \
            --framework-name RTXProbeDext \
            -- \
            -target x86_64-apple-driverkit \
            -isysroot "$DK" \
            -x c++ -std=gnu++17 \
            -I driver/RTXProbeDext
          clang++ -c -isysroot "$DK" -target x86_64-apple-driverkit -std=gnu++17 \
            -fno-exceptions -fno-rtti -I build -I driver/RTXProbeDext \
            driver/RTXProbeDext/RTXProbeDext.cpp -o build/RTXProbeDext.o
          clang++ -c -isysroot "$DK" -target x86_64-apple-driverkit -std=gnu++17 \
            -fno-exceptions -fno-rtti -I build -I driver/RTXProbeDext \
            build/RTXProbeDext.iig.cpp -o build/RTXProbeDext.iig.o
          echo "OK: RTXProbeDext dext compiles"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtxmacoc-build
          path: build/
          if-no-files-found: ignore
